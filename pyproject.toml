[project]
name = "public-safety-data-analyzer"
version = "0.1.0"
description = "Applicazione Python per l'analisi descrittiva di dati aggregati relativi a eventi di pubblica sicurezza."
requires-python = ">=3.9"
dependencies = [
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
    "coverage",
    "pylint",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "analisi", "caricatore_dati"]
